[project]
name = "thetabot"
version = "0.1.0"
description = "Alert-only options scanner: reads Robinhood, sends webhook alerts, never places orders."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Optional extras. Core dependencies are enough to import the package.
# Pin mcp: a newer release renamed streamablehttp_client and broke the Robinhood connect.
# Keep the known-good version so rebuilds stay reproducible.
mcp = ["mcp==1.28.1"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
ai = ["anthropic>=0.69"]
all = [
    "mcp==1.28.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "anthropic>=0.69",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
agentic = "agentic.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]

# dashboard.html is the page template. Hatchling's wheel only packs Python
# files unless they are force-included; the destination is the installed package.
[tool.hatch.build.targets.wheel.force-include]
"src/agentic/web/dashboard.html" = "agentic/web/dashboard.html"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
